version: '3.8'

services:
  whatsapp-webhook:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge
