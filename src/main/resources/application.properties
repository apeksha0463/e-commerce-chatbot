server.port=3002
server.address=0.0.0.0
spring.application.name=whatsapp-webhook

# BGS API Configuration
app.bgs.base-url=${NEXT_PUBLIC_API_BASE_URL:https://be.bgsinfotech.com}
app.bgs.tenant-id=${NEXT_PUBLIC_TENANT_ID:697c756692a4f15176fefe8e}

# AiSensy Configuration
app.aisensy.api-key=${AISENSY_API_KEY:577d0643178707e58a3b0}
app.aisensy.project-id=${AISENSY_PROJECT_ID:69da0b7a7dec1710f8a9db08}


# App Config
app.session.timeout-minutes=30
app.validation.min-address-length=10
app.validation.pincode-length=6

# Carousel: set to true to enable verbose payload/response logging (development only).
# MUST be false in production to avoid leaking sensitive data into logs.
app.carousel.debug=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# RestTemplate Timeouts
# NOTE: app.rest.read-timeout must be > 12000 ms to accommodate payment session polling
# (PaymentService polls up to 6x with 2s delays = 12s max blocking time).
app.rest.connect-timeout=5000
app.rest.read-timeout=15000
app.rest.max-conn-total=100
app.rest.max-conn-per-route=20

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.bgsApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bgsApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bgsApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bgsApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.bgsApi.minimumNumberOfCalls=5

# Logging
logging.level.root=INFO
logging.level.com.example.whatsapp=DEBUG
logging.level.org.springframework.web.client.RestTemplate=INFO
